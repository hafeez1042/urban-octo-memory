services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app_dev
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_dev"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: "3000"
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres-data:
